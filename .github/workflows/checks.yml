name: Django checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m black --check .
      - run: python -m djlint templates --check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - run: python manage.py load_company_content
      - run: python manage.py collectstatic --noinput
      - name: Production configuration check
        env:
          DJANGO_SECRET_KEY: ci-only-check-key-not-for-deployment-901234567890123456789
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_SITE_URL: https://example.com
        run: python manage.py check --deploy --fail-level ERROR --settings=config.settings_production
